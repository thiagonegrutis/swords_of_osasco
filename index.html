/* ===== CONTROLE POR TOQUE ===== */
const ctl=document.getElementById('ctl'),pad=document.getElementById('pad'),knob=document.getElementById('knob');
function setK(k,v){if(v&&!dn[k])pr[k]=1;dn[k]=v?1:0}
function wake(){try{AC=AC||new AudioContext();AC.resume()}catch(e){}}
function padMove(t){const r=pad.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=r.width*.15;
 setK('ArrowLeft',dx<-m);setK('ArrowRight',dx>m);setK('ArrowUp',dy<-m);setK('ArrowDown',dy>m);
 const d=Math.hypot(dx,dy)||1,k=Math.min(d,r.width*.3);knob.style.transform=`translate(${dx/d*k}px,${dy/d*k}px)`}
function padEnd(){['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].forEach(k=>setK(k,0));knob.style.transform=''}
const NP={passive:false};
pad.addEventListener('touchstart',e=>{e.preventDefault();wake();padMove(e.changedTouches[0])},NP);

 else if(st=='over')st='title';else if(st=='win')tapUI(x,y);else if(st=='pause'||st=='camp'||st=='title'||st=='cfg'||st=='create')tapUI(x,y)},NP);
